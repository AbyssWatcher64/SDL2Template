[Mouse & Keyboard]
# If the input is incorrect, the game will most likely crash.
# This is the link of the possible inputs: https://wiki.libsdl.org/SDL2/SDL_Scancode
DPAD_UP=W
DPAD_DOWN=S
DPAD_LEFT=A
DPAD_RIGHT=D
BUTTON_UP=LEFT SHIFT
BUTTON_DOWN=SPACE
BUTTON_LEFT=Q
BUTTON_RIGHT=E
BUTTON_START=ESCAPE
BUTTON_SELECT=RETURN
BUTTON_LSHOULDER=TAB
BUTTON_RSHOULDER=R

